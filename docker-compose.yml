services:
  db:
    image: postgres:16-alpine
    container_name: cs2-higherlower-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cs_higherlower
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - cs2_higherlower_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cs_higherlower"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cs2_higherlower_pgdata:
